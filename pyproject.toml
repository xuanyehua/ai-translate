[project]
name = "ai-translate"
version = "0.1.0"
description = "Document translation tool with MinerU parsing and configurable LLM backends"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
    "mistune>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
